# الاختبارات عند كل دفع: المنطق، الأنواع، الصلاحيات (RLS)، دوال الخادم، واختبار كل الشاشات في متصفح
name: CI
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Web export
        working-directory: apps/mobile
        run: npx expo export -p web --output-dir /tmp/web
      - name: Install browser
        run: npx -y playwright@1 install --with-deps chromium
      - name: Smoke test every screen
        working-directory: apps/mobile
        run: |
          npm i --no-save playwright@1
          node e2e/smoke.cjs /tmp/web
          node e2e/flows.cjs /tmp/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/mobile/e2e/shots

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        working-directory: supabase/functions
        run: for f in */index.ts; do echo "== $f"; deno check --node-modules-dir=none "$f"; done

  # المزامنة الحقيقية: Supabase كامل محلياً (Docker) + supabase-js بنفس شكل بيانات التطبيق
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Sync end-to-end
        run: |
          supabase status -o env | sed 's/=.*//' | tr '\n' ' '; echo
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_TEST_ANON="${ANON_KEY:-$PUBLISHABLE_KEY}"
          export SUPABASE_TEST_SERVICE="${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          [ -n "$SUPABASE_TEST_ANON" ] && [ -n "$SUPABASE_TEST_SERVICE" ] || { echo "::error::لم أجد مفاتيح Supabase المحلية"; exit 1; }
          npx vitest run --root supabase/tests
