# يطبّق migrations ويرفع دوال الخادم ويضبط أسرارها على Supabase (يحتاج SUPABASE_ACCESS_TOKEN و SUPABASE_PROJECT_REF و SUPABASE_DB_PASSWORD)
name: Deploy Supabase
on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-faraday-pi2wwb]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "::warning::أسرار Supabase غير مضافة — تخطّي (راجع docs/SETUP_TODO.md)."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Link project and apply migrations
        if: steps.check.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Function secrets
        if: steps.check.outputs.ok == 'true'
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          args=()
          [ -n "$PUSH_SECRET" ] && args+=("PUSH_SECRET=$PUSH_SECRET")
          [ -n "$FCM_SERVICE_ACCOUNT" ] && args+=("FCM_SERVICE_ACCOUNT=$FCM_SERVICE_ACCOUNT")
          [ ${#args[@]} -gt 0 ] && supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" || echo "لا أسرار للدوال بعد"
      - name: Deploy functions
        if: steps.check.outputs.ok == 'true'
        run: |
          for d in supabase/functions/*/; do
            n=$(basename "$d"); [ "$n" = "_shared" ] && continue
            supabase functions deploy "$n" --project-ref "$PROJECT_REF"
          done
