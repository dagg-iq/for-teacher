# يطبّق migrations ويرفع دوال الخادم ويضبط أسرارها على Supabase (يحتاج SUPABASE_ACCESS_TOKEN و SUPABASE_PROJECT_REF و SUPABASE_DB_PASSWORD)
name: Deploy Supabase
on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-faraday-pi2wwb]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "::warning::أسرار Supabase غير مضافة — تخطّي (راجع docs/SETUP_TODO.md)."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: 3.2.0
      - name: Link project and apply migrations
        if: steps.check.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # كلمة السر تُقرأ من SUPABASE_DB_PASSWORD؛ CLI 3 يحتاج --remote و --yes (بلا سؤال تأكيد)
          supabase db push --remote --include-all --yes
      - name: Auth settings (login without email confirmation, redirects, optional Google & SMTP)
        if: steps.check.outputs.ok == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://nahj-iq.web.app' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
        run: |
          # بريد Supabase المجاني لا يصل إلا لأعضاء فريق المشروع، فالدخول يعمل بلا رسالة تأكيد
          body=$(jq -n --arg site "$SITE_URL" '{
            site_url: $site,
            uri_allow_list: "nahj://auth-callback,nahj://**,\($site)/**",
            mailer_autoconfirm: true,
            password_min_length: 6
          }')
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            body=$(jq --arg id "$GOOGLE_CLIENT_ID" --arg sec "$GOOGLE_CLIENT_SECRET" '. + {external_google_enabled: true, external_google_client_id: $id, external_google_secret: $sec}' <<<"$body")
            echo "Google sign-in: on"
          fi
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            body=$(jq --arg h "$SMTP_HOST" --arg p "${SMTP_PORT:-587}" --arg u "$SMTP_USER" --arg pw "$SMTP_PASS" --arg from "${SMTP_SENDER:-$SMTP_USER}" \
              '. + {smtp_host: $h, smtp_port: $p, smtp_user: $u, smtp_pass: $pw, smtp_admin_email: $from, smtp_sender_name: "نَهج", rate_limit_email_sent: 100}' <<<"$body")
            echo "SMTP: on"
          fi
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @- <<<"$body")
          if [ "$code" -ge 300 ]; then echo "::error::Auth settings failed ($code)"; head -c 600 /tmp/auth.json; exit 1; fi
          jq '{site_url, uri_allow_list, mailer_autoconfirm, external_google_enabled, smtp_host: (.smtp_host != null and .smtp_host != "")}' /tmp/auth.json
      - name: Function secrets
        if: steps.check.outputs.ok == 'true'
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          args=()
          [ -n "$PUSH_SECRET" ] && args+=("PUSH_SECRET=$PUSH_SECRET")
          [ -n "$FCM_SERVICE_ACCOUNT" ] && args+=("FCM_SERVICE_ACCOUNT=$FCM_SERVICE_ACCOUNT")
          [ ${#args[@]} -gt 0 ] && supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" || echo "لا أسرار للدوال بعد"
      - name: Deploy functions
        if: steps.check.outputs.ok == 'true'
        run: |
          for d in supabase/functions/*/; do
            n=$(basename "$d"); [ "$n" = "_shared" ] && continue
            supabase functions deploy "$n" --project-ref "$PROJECT_REF" --yes
          done
