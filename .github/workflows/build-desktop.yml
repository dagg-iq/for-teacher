# يبني نسخة نَهج للحاسوب (ويندوز): مثبّت Setup.exe ونسخة محمولة Portable.exe لا تحتاج تثبيتاً،
# من نفس واجهة التطبيق (نسخة الويب من Expo) داخل Electron، وينشرهما في صفحة Releases.
name: Build Desktop
on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-faraday-pi2wwb]
    paths:
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - 'packages/shared/src/**'
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://nahj-iq.web.app' }}
      EXPO_PUBLIC_SYNC_BACKEND: ${{ vars.SYNC_BACKEND || 'supabase' }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || '' }}
      APK_BUILD: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Web build of the app
        working-directory: apps/mobile
        # مكتبة التعرّف على الكلام داخل الجهاز (Whisper) تُشحن مع التطبيق
        run: |
          node scripts/vendor-whisper.cjs
          npx expo export -p web --output-dir ../desktop/web
      - name: Package for Windows
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm pkg set version="1.0.${{ github.run_number }}"
          npx electron-builder --win nsis portable --x64 --publish never
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: nahj-windows
          path: |
            apps/desktop/dist/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: نَهج للحاسوب — نسخة ${{ github.run_number }}
          body: |
            نَهج لويندوز:
            - **Nahj-Setup-…exe**: مثبّت (اختصار على سطح المكتب وقائمة ابدأ).
            - **Nahj-Portable-…exe**: يعمل مباشرة بلا تثبيت.
            إن ظهر تحذير SmartScreen: «مزيد من المعلومات» ← «تشغيل على أي حال» (النسخة غير موقّعة بشهادة تجارية بعد).
            الكود: ${{ github.sha }}
          prerelease: true
          files: apps/desktop/dist/*.exe

      - name: Point the site's Windows button at the new version
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          V="1.0.$N"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-$N"
          SETUP="apps/desktop/dist/Nahj-Setup-$V.exe"
          [ -f "$SETUP" ] || { echo "::warning::لم أجد $SETUP"; ls apps/desktop/dist; exit 0; }
          SIZE=$(( ($(wc -c < "$SETUP") + 524288) / 1048576 ))
          git config user.name "nahj-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
            printf '{\n  "link": "%s",\n  "portable": "%s",\n  "version": "%s",\n  "size_mb": "%s"\n}\n' "$BASE/Nahj-Setup-$V.exe" "$BASE/Nahj-Portable-$V.exe" "$V" "$SIZE" > apps/site/download-desktop.json
            git add apps/site/download-desktop.json
            git diff --cached --quiet && break
            git commit -m "نسخة الحاسوب $V: رابط التنزيل"
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 3))
          done
          gh workflow run deploy-site.yml --ref "$GITHUB_REF_NAME" || true
