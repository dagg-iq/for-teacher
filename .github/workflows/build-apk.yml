# يبني ملف APK لتطبيق نَهج وينشره في صفحة Releases.
# الأسرار (اختيارية، والبناء ينجح بدونها):
#   SUPABASE_URL و SUPABASE_ANON_KEY  ← المزامنة السحابية والحساب
#   GOOGLE_SERVICES_JSON              ← الإشعارات البعيدة (Firebase)
#   SIGNING_PASSPHRASE                ← مفتاح التوقيع الخاص (بعد تشغيل Create Signing Key)
#   RELEASES_TOKEN                    ← نشر النسخة في مستودع عام + تحديث زر التنزيل في الموقع
# المتغير EAS_PROJECT_ID (اختياري)    ← تفعيل التحديث الفوري بلا تنزيل (OTA)
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, claude/fervent-faraday-pi2wwb]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || 'dagg-iq/nahj-releases' }}
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://nahj-iq.web.app' }}
      # يفعّل التحديث الفوري (OTA) داخل النسخة إن رُبط المشروع بـ EAS
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      # المزامنة عبر خادم Oracle بدل Supabase (docs/ORACLE.md)
      EXPO_PUBLIC_SYNC_BACKEND: ${{ vars.SYNC_BACKEND || 'supabase' }}
      EXPO_PUBLIC_GOOGLE_AUTH: ${{ secrets.GOOGLE_CLIENT_SECRET != '' }}
      EXPO_PUBLIC_PASSWORD_RESET: ${{ secrets.SMTP_PASS != '' }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test

      - name: Firebase config (notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('apps/mobile/google-services.json','utf8')); console.log('✓ google-services.json')"
          else
            echo "::warning::السر GOOGLE_SERVICES_JSON غير موجود — النسخة بلا إشعارات بعيدة (التذكير المحلي يعمل)."
          fi
          [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || echo "::warning::السر SUPABASE_URL غير موجود — النسخة تعمل محلياً بلا مزامنة سحابية."

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          APK_BUILD: ${{ github.run_number }}

      - name: Release signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          ENC=signing/nahj-release.keystore.enc
          if [ -f "$ENC" ]; then
            [ -n "$SIGNING_PASSPHRASE" ] || { echo "::error::مفتاح التوقيع موجود لكن السر SIGNING_PASSPHRASE غير مضاف."; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_PASSPHRASE -in "$ENC" -out "$RUNNER_TEMP/nahj.keystore"
            { echo "NAHJ_KEYSTORE=$RUNNER_TEMP/nahj.keystore"; echo "NAHJ_KEY_ALIAS=nahj"; } >> "$GITHUB_ENV"
            NAHJ_KEYSTORE="$RUNNER_TEMP/nahj.keystore" NAHJ_STORE_PASSWORD="$SIGNING_PASSPHRASE" NAHJ_KEY_ALIAS=nahj NAHJ_KEY_PASSWORD="$SIGNING_PASSPHRASE" node scripts/apply-signing.js
          else
            echo "::notice::لا يوجد مفتاح توقيع خاص بعد — النسخة موقّعة بمفتاح Expo العام. شغّل Create Signing Key قبل النشر للمدرسين."
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          APK_BUILD: ${{ github.run_number }}
          NAHJ_STORE_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
          NAHJ_KEY_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../../../gradle.log
          exit ${PIPESTATUS[0]}

      - name: Show error details
        if: failure()
        run: grep -n -i -E "error|exception|caused by|what went wrong" gradle.log | grep -v -i warning | head -150 || true

      - name: Rename and verify APK
        env:
          NAHJ_STORE_PASSWORD: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/nahj.apk
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          # إعادة التوقيع دائماً بـ v1+v2+v3: هواتف ريلمي/أوبو (ColorOS) ترفض الملف بـ«الحزمة غير صالحة» إن غاب توقيع v1،
          # وGradle وapksigner يتركانه عند minSdk ≥ 24، لذلك نمرّر --min-sdk-version 21 ليُضاف v1 فعلاً.
          # بلا مفتاح خاص نستعمل مفتاح debug الذي وقّع به Gradle نفسه.
          if [ -z "${NAHJ_KEYSTORE:-}" ]; then
            NAHJ_KEYSTORE=apps/mobile/android/app/debug.keystore; NAHJ_KEY_ALIAS=androiddebugkey; NAHJ_STORE_PASSWORD=android
          fi
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner غير موجود"; exit 1; }
          "$APKSIGNER" sign --ks "$NAHJ_KEYSTORE" --ks-key-alias "$NAHJ_KEY_ALIAS" --ks-pass env:NAHJ_STORE_PASSWORD --key-pass env:NAHJ_STORE_PASSWORD \
            --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out out/signed.apk out/nahj.apk
          mv out/signed.apk out/nahj.apk; rm -f out/nahj.apk.idsig
          # verify يتجاهل v1 إن لم نخبره بأن الهاتف قد يكون أقدم من أندرويد ٧، فنمرّر --min-sdk-version 21 هنا أيضاً
          "$APKSIGNER" verify -v --print-certs --min-sdk-version 21 out/nahj.apk | tee out/verify.txt | grep -E 'Verified using|DN|SHA-256'
          grep -q 'v1 scheme (JAR signing): true' out/verify.txt || { echo "::error::توقيع v1 مفقود"; exit 1; }
          unzip -l out/nahj.apk | grep -E 'META-INF/.*\.(SF|RSA)$'
          rm -f out/verify.txt
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: nahj-apk
          path: out/nahj.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: نَهج — نسخة ${{ github.run_number }}
          body: |
            ملف APK لتطبيق نَهج (أندرويد). حمّل nahj.apk وثبّته.
            الفرع: ${{ github.ref_name }} — الكود: ${{ github.sha }}
          prerelease: true
          files: out/nahj.apk

      - name: Publish to public releases repo
        if: env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: apk-${{ github.run_number }}
          name: نَهج — نسخة ${{ github.run_number }}
          body: ملف APK لتطبيق نَهج (أندرويد).
          make_latest: true
          files: out/nahj.apk

      - name: Point the site's download button at the new version
        if: env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          SIZE=$(( ($(stat -c %s out/nahj.apk) + 524288) / 1048576 ))
          URL="https://github.com/$RELEASES_REPO/releases/download/apk-$N/nahj.apk"
          git config user.name "nahj-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME" && git reset --hard "origin/$GITHUB_REF_NAME"
            printf '{\n  "link": "%s",\n  "version": "%s",\n  "size_mb": "%s"\n}\n' "$URL" "$N" "$SIZE" > apps/site/download-config.json
            git add apps/site/download-config.json
            git diff --cached --quiet && break
            git commit -m "نسخة التطبيق $N: رابط التنزيل"
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 3))
          done
          gh workflow run deploy-site.yml --ref "$GITHUB_REF_NAME" || true
