<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة إدارة نَهج</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/config.js"></script>
</head>
<body>
  <!-- الدخول -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <picture class="brand-logo"><source srcset="/logo-light.svg" media="(prefers-color-scheme: dark)"><img src="/logo.svg" alt="نَهج" height="54"></picture>
      <h1>لوحة إدارة نَهج</h1>
      <p class="muted">للمدير فقط. سجّل الدخول بحساب Google المعتمد.</p>
      <button id="google" class="btn btn-google" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
        الدخول بحساب Google
      </button>
      <p id="login-msg" class="login-msg" role="alert"></p>
    </div>
  </main>

  <!-- اللوحة -->
  <div id="app" class="shell" hidden>
    <aside class="side">
      <div class="side-brand">
        <picture><source srcset="/logo-light.svg" media="(prefers-color-scheme: dark)"><img src="/logo.svg" alt="نَهج" height="34"></picture>
        <small>لوحة الإدارة</small>
      </div>
      <nav class="nav" id="nav">
        <a href="#overview" data-view="overview"><span class="ic" data-i="grid"></span>نظرة عامة</a>
        <a href="#requests" data-view="requests"><span class="ic" data-i="inbox"></span>الطلبات <em id="badge" class="badge" hidden>0</em></a>
        <a href="#teachers" data-view="teachers"><span class="ic" data-i="users"></span>المدرّسون</a>
        <a href="#news" data-view="news"><span class="ic" data-i="megaphone"></span>الإعلانات</a>
        <a href="#settings" data-view="settings"><span class="ic" data-i="settings"></span>الإعدادات</a>
      </nav>
      <div class="me">
        <img id="me-pic" alt="" referrerpolicy="no-referrer">
        <div class="me-txt"><b id="me-name"></b><small id="me-email"></small></div>
        <button id="logout" class="btn btn-ghost btn-sm" type="button">خروج</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <h1 id="title">نظرة عامة</h1>
        <div class="top-actions">
          <span id="updated" class="muted small"></span>
          <button id="refresh" class="btn btn-ghost btn-sm" type="button" title="تحديث"><span data-i="refresh"></span>تحديث</button>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <!-- لوحة تفاصيل المدرّس -->
  <div id="drawer-bg" class="drawer-bg" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>

  <!-- نافذة التأكيد/الإدخال -->
  <dialog id="dlg" class="dlg"><form method="dialog" id="dlg-form"></form></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
