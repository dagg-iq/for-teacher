# إعدادات Supabase المحلية (supabase start في CI). المشروع الحقيقي يُضبط من لوحة Supabase.
project_id = "nahj"

[api]
enabled = true
schemas = ["public"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["nahj://auth-callback"]
enable_signup = true

[auth.email]
enable_confirmations = false

[functions.push]
verify_jwt = false

# الدالة تتحقق من المستخدم بنفسها (requireUser)؛ فحص البوابة لا يتوافق مع مفاتيح JWT الجديدة (asymmetric) في المشاريع الحديثة
[functions.delete-account]
verify_jwt = false

# لوحة الإدارة: تتحقق بنفسها من رمز Google (Firebase) وبريد المدير
[functions.admin]
verify_jwt = false

# إشعار المدير بطلب حساب جديد: تتحقق من المستخدم بنفسها
[functions.access-request]
verify_jwt = false
